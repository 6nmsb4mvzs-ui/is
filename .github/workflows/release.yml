# Auto-release on version bump in Info.plist
name: Auto Release

on:
  push:
    branches: [main]
    paths: ["Sources/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Read version
        id: version
        run: |
          v=$(grep -o 'appVersion = "[^"]*"' Sources/IdleSlayerCheat/UpdateManager.swift | cut -d'"' -f2)
          [ -n "$v" ] || { echo "No version found"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Found version: $v"
      
      - name: Build app
        run: |
          swift build -c release --quiet
      
      - name: Create app bundle
        run: |
          mkdir -p "build/Idle Slayer Cheat.app/Contents/MacOS"
          mkdir -p "build/Idle Slayer Cheat.app/Contents/Resources"
          cp .build/release/IdleSlayerCheat "build/Idle Slayer Cheat.app/Contents/MacOS/"
          
          cat > "build/Idle Slayer Cheat.app/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Idle Slayer Cheat</string>
              <key>CFBundleIdentifier</key>
              <string>com.idle.slayer.cheat</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.version }}</string>
              <key>CFBundleExecutable</key>
              <string>IdleSlayerCheat</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          PLIST
      
      - name: Create zip
        run: |
          cd build
          zip -r "Idle_Slayer_Cheat-v${{ steps.version.outputs.version }}.zip" "Idle Slayer Cheat.app"
      
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists"
            exit 0
          fi
          
          gh release create "v$V" \
            "build/Idle_Slayer_Cheat-v$V.zip" \
            --title "Idle Slayer Cheat v$V" \
            --notes "Auto-released from main branch"
